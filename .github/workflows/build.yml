name: Build Launcher APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép nhấn nút Run Workflow thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Launcher APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanYourTV-Launcher-Debug
        path: |
          app/build/outputs/apk/debug/*.apk
          launcher/build/outputs/apk/debug/*.apk
