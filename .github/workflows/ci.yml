name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
     
  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        env:
         RELEASE_STORE_FILE: ${{ github.workspace }}/cleantv-release.jks
         RELEASE_STORE_PASSWORD: testpass123
         RELEASE_KEY_ALIAS: testkey
         RELEASE_KEY_PASSWORD: testpass123
        working-directory: launcher
        run: |
          chmod +x gradlew
           ./gradlew assembleRelease --stacktrace
           
      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-release-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
