name: Add-ons

# Cho phép chạy tự động khi push/PR hoặc bấm nút thủ công trên giao diện GitHub
on:
  pull_request:
    paths: ["addons/**"]
  push:
    branches: [main]
    paths: ["addons/**"]
  workflow_dispatch: # Kích hoạt nút "Run workflow" thủ công

permissions:
  contents: read

jobs:
  build:
    name: Build add-ons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Build all add-ons (or changed ones on push/PR)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$IS_MANUAL" = "true" ]; then
            echo "::notice::Manual trigger detected: Building ALL add-ons."
            # Lấy tất cả các thư mục con trong thư mục addons/
            changed=$(ls -d addons/* | awk -F/ '{print $2}' | sort -u)
          else
            # Lọc theo các add-on có thay đổi khi push/PR
            changed=$(git diff --name-only "$BASE" HEAD -- addons | awk -F/ 'NF>2 {print $2}' | sort -u)
          fi

          [ -z "$changed" ] && { echo "no add-ons found"; exit 0; }
          
          for a in $changed; do
            [ -d "addons/$a" ] || continue
            [ -f "addons/$a/gradlew" ] || { echo "addons/$a has no gradlew"; continue; }
            echo "::group::addons/$a"
            (cd "addons/$a" && chmod +x gradlew && ./gradlew --no-daemon assembleRelease)
            echo "::endgroup::"
          done

      - name: Upload Add-ons APKs
        uses: actions/upload-artifact@v4
        with:
          name: addons-release-apks
          path: addons/*/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          
